<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">FISPACT-II activation workflow</title>
  <desc id="description">Part A prepares spectrum files and an inventory input from MCNP results, material, and operating history. Both inputs go to FISPACT-II. Part B processes its output with FispactOutput to obtain dose, heat, activity, and pathways.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#52677d"/>
    </marker>
    <style>
      .group { fill: #f5f8fc; stroke: #b8c8d8; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #56718c; stroke-width: 2; }
      .highlight { fill: #e8f2fb; stroke: #356b9a; stroke-width: 2.5; }
      .edge { fill: none; stroke: #52677d; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #26384a; }
      .group-label { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #26384a; }
      .small { font: 15px "Segoe UI", Arial, sans-serif; fill: #34495e; }
    </style>
  </defs>

  <rect class="group" x="20" y="25" width="690" height="390" rx="14"/>
  <rect class="group" x="730" y="25" width="450" height="390" rx="14"/>
  <text class="group-label" x="45" y="60">Part A - preparation</text>
  <text class="group-label" x="755" y="60">Part B - post-processing</text>

  <rect class="node" x="45" y="100" width="150" height="64" rx="8"/>
  <text class="label" x="120" y="128" text-anchor="middle">mctal, tally 4</text>
  <text class="small" x="120" y="150" text-anchor="middle">neutron flux</text>

  <rect class="node" x="245" y="100" width="135" height="64" rx="8"/>
  <text class="label" x="312" y="138" text-anchor="middle">Spectra</text>

  <rect class="node" x="430" y="90" width="245" height="84" rx="8"/>
  <text class="label" x="552" y="120" text-anchor="middle">flux files</text>
  <text class="small" x="552" y="147" text-anchor="middle">collapse.i, condense.i</text>

  <rect class="node" x="45" y="260" width="150" height="58" rx="8"/>
  <text class="label" x="120" y="295" text-anchor="middle">MCNP material</text>

  <rect class="node" x="45" y="335" width="150" height="62" rx="8"/>
  <text class="label" x="120" y="360" text-anchor="middle">Operating history</text>
  <text class="small" x="120" y="383" text-anchor="middle">IrradiationScenario</text>

  <rect class="node" x="250" y="292" width="165" height="66" rx="8"/>
  <text class="label" x="332" y="331" text-anchor="middle">FispactInp</text>

  <rect class="node" x="475" y="292" width="190" height="66" rx="8"/>
  <text class="label" x="570" y="320" text-anchor="middle">inventory input</text>
  <text class="small" x="570" y="343" text-anchor="middle">irradiation and cooling</text>

  <rect class="highlight" x="755" y="190" width="145" height="68" rx="8"/>
  <text class="label" x="827" y="230" text-anchor="middle">FISPACT-II</text>

  <rect class="node" x="940" y="190" width="76" height="68" rx="8"/>
  <text class="label" x="978" y="230" text-anchor="middle">.out</text>

  <rect class="node" x="1050" y="190" width="110" height="68" rx="8"/>
  <text class="label" x="1105" y="220" text-anchor="middle">Fispact</text>
  <text class="label" x="1105" y="242" text-anchor="middle">Output</text>

  <rect class="highlight" x="930" y="305" width="230" height="68" rx="8"/>
  <text class="label" x="1045" y="333" text-anchor="middle">dose, heat, activity</text>
  <text class="small" x="1045" y="356" text-anchor="middle">and reaction pathways</text>

  <path class="edge" d="M195 132 H245"/>
  <path class="edge" d="M380 132 H430"/>
  <path class="edge" d="M195 289 H220 V312 H250"/>
  <path class="edge" d="M195 366 H220 V338 H250"/>
  <path class="edge" d="M415 325 H475"/>
  <path class="edge" d="M675 132 H720 V211 H755"/>
  <path class="edge" d="M665 325 H710 V245 H755"/>
  <path class="edge" d="M900 224 H940"/>
  <path class="edge" d="M1016 224 H1050"/>
  <path class="edge" d="M1105 258 V305"/>
</svg>
